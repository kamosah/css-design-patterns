<html lang="en">
<head>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="accordion">
    <div class="accordion-item">
      <input type="checkbox" id="panel1">
      <label for="panel1" class="accordion-header">Section 1</label>
      <div class="accordion-content">
        <p>Glassmorphism creates a frosted glass effect using backdrop-filter blur and semi-transparent backgrounds.</p>
      </div>
    </div>
    <div class="accordion-item">
      <input type="checkbox" id="panel2">
      <label for="panel2" class="accordion-header">Section 2</label>
      <div class="accordion-content">
        <p>The hidden checkbox technique lets pure CSS manage toggle state without any JavaScript.</p>
      </div>
    </div>
    <div class="accordion-item">
      <input type="checkbox" id="panel3">
      <label for="panel3" class="accordion-header">Section 3</label>
      <div class="accordion-content">
        <p>The max-height transition creates a smooth expand and collapse animation driven entirely by CSS.</p>
      </div>
    </div>
  </div>
</body>
</html>
