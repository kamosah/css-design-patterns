<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Description</th>
          <th>Price</th>
          <th>Availability</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td data-label="Name">Widget A</td>
          <td data-label="Description">A versatile widget for all needs.</td>
          <td data-label="Price">$10.00</td>
          <td data-label="Availability">In Stock</td>
        </tr>
        <tr>
          <td data-label="Name">Gadget B</td>
          <td data-label="Description">A compact and portable gadget.</td>
          <td data-label="Price">$24.99</td>
          <td data-label="Availability">Out of Stock</td>
        </tr>
        <tr>
          <td data-label="Name">Gizmo C</td>
          <td data-label="Description">Smart gizmo with advanced features.</td>
          <td data-label="Price">$49.95</td>
          <td data-label="Availability">Pre-order</td>
        </tr>
        <tr>
          <td data-label="Name">Doohickey D</td>
          <td data-label="Description">A handy doohickey for everyday use.</td>
          <td data-label="Price">$7.50</td>
          <td data-label="Availability">In Stock</td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
