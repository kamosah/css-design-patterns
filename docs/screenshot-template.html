<!--
  PR SCREENSHOT TEMPLATE
  ======================
  Storybook-style canvas for capturing component screenshots.
  Used in PR descriptions as a 2-column grid: Starter vs Design System Component.

  VIEWPORT SIZING RULES
  ─────────────────────
  Resize the browser before screenshotting based on component scale:

  Inline / small (toggles, badges, buttons, inputs, segmented controls)
    → 480 × 300   — tight crop, component fills the spotlight

  Medium (dropdowns, form groups, cards, modals)
    → 640 × 400   — room to breathe without excess whitespace

  Block / page-level (full layouts, page sections, grid systems)
    → 1280 × 720  — full viewport, no forced centering needed

  WORKFLOW (with Playwright MCP)
  ──────────────────────────────
  1. Copy this file to docs/_tmp_starter.html and docs/_tmp_component.html
  2. In _tmp_starter.html:  paste starter HTML + no component CSS
  3. In _tmp_component.html: paste the design system component HTML + full CSS
     (add width to .component-wrapper if flex: 1 children collapse)
  4. Serve the docs/ directory:
       python3 -m http.server 8765
  5. Resize viewport to match the sizing rule above, then navigate and screenshot:
       browser_resize        → target dimensions
       browser_navigate      → http://localhost:8765/_tmp_starter.html
       browser_take_screenshot → docs/<name>-starter.png
       browser_navigate      → http://localhost:8765/_tmp_component.html
       browser_take_screenshot → docs/<name>-component.png
  6. Kill the server and delete the _tmp_* files
  7. Use the PR table below in the pull request body

  PR DESCRIPTION TABLE
  ────────────────────
  | Starter | Component |
  |---------|-----------|
  | ![Starter](https://raw.githubusercontent.com/<owner>/<repo>/<branch>/docs/<name>-starter.png) | ![Component](https://raw.githubusercontent.com/<owner>/<repo>/<branch>/docs/<name>-component.png) |

  Replace <owner>, <repo>, <branch>, and <name> to match your branch.
  Use raw.githubusercontent.com so images render inline without clicking.
-->
